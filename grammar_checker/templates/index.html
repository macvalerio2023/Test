<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar and Punctuation Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Check your text for grammar and punctuation errors</h1>
    <form action="/check" method="post">
        <textarea name="text" rows="10" cols="50" required></textarea>
        <br><br>
        <button type="submit">Check Text</button>
    </form>
    <div id="results">
        <h2>Results:</h2>
        {% if matches %}
            <ul>
                {% for match in matches %}
                    <li>{{ match.ruleId }}: {{ match.message }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No errors found.</p>
        {% endif %}
    </div>
</body>
</html>
